name: Formatting

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  SQLX_OFFLINE: "true"

jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (2024-10-22)
        with:
          components: rustfmt, clippy
      - name: Install just
        run: sudo apt-get update && sudo apt-get install -y just
      - name: Install typos
        run: cargo install typos-cli
      - name: Install actionlint
        run: |
          curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash -s -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run pre-commit checks
        run: just pre-commit
