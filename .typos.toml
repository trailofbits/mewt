[default.extend-words]
# "seh" is Structured Exception Handling (Microsoft __try/__except/__finally).
# It appears in the vendored tree-sitter C++ grammar's symbol names
# (sym_seh_try_statement, sym_seh_leave_statement, etc.).
seh = "seh"

# "memeber" is a typo in the upstream Sui Move tree-sitter grammar's symbol name
# (_spec_block_memeber). It appears in vendored parser.c and grammar.js files that
# we do not control. Accept it to avoid false positives in typos checks.
memeber = "memeber"

# "mis" appears in an upstream Aptos Move vendored grammar comment
# ("mis-parsed") and is not project-authored prose.
mis = "mis"

# "synomym" is a typo in the upstream tree-sitter-haskell grammar's symbol name
# (sym_type_synomym). It appears in vendored parser.c that we do not control.
synomym = "synomym"

# "varaint" is a typo in the upstream tree-sitter-ruby grammar's comment
# ("command varaint") in grammar.js. We do not control this vendored file.
varaint = "varaint"

# "tyops" is the upstream tree-sitter-haskell grammar's abbreviation for
# "type operators" (`_tyops` rule). Not a typo, despite what `typos` thinks.
tyops = "tyops"
