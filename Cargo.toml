[package]
name = "mewt"
version = "3.0.1"
edition = "2024"
description = "Mutation testing framework with multi-language support"
authors = ["Bo Henderson <bo.henderson@trailofbits.com>"]
license = "AGPL-3.0"
repository = "https://github.com/trailofbits/mewt"
homepage = "https://github.com/trailofbits/mewt"
keywords = ["mutation", "testing"]
categories = ["development-tools::testing", "security"]

[[bin]]
name = "mewt"
path = "src/main.rs"

[lib]
name = "mewt"
path = "src/lib.rs"

[dependencies]
# Shared dependencies across all crates
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.5.60", features = ["derive"] }
console = "0.16"
ctrlc = { version = "3.5.2", features = ["termination"] }
dirs-next = "2.0"
fern = "0.7.1"
glob = "0.3"
globset = "0.4"
hex = "0.4.3"
indicatif = "0.18"
log = "0.4.29"
once_cell = "1.21"
regex = "1.12.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
similar = { version = "2.4.0", features = ["inline", "unicode"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite"] }
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["full"] }
toml = "1.1"
tree-sitter = "0.26"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
tempfile = "3.27"
pretty_assertions = "1.4"
tokio-test = "0.4"

[build-dependencies]
cc = "1.2"

[profile.dist]
inherits = "release"
lto = "thin"

# Clippy lints configuration
[lints.clippy]
# Allow nested ifs instead of let-chains for broader edition compatibility
collapsible_if = "allow"
